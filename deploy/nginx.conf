server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location ^~ /api/ {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 503 '{"message":"The backend API is not deployed yet; this Cloud Run service currently hosts the frontend preview."}';
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
