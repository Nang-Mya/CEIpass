server:
  port: ${PORT:8080}

spring:
  application:
    name: cei-pass-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: app
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500}
  auth:
    frontend-url: ${FRONTEND_URL:http://localhost:5500}
    registration-enabled: ${ACCOUNT_REGISTRATION_ENABLED:false}
  privacy:
    notice-version: ${PRIVACY_NOTICE_VERSION:unpublished}
    notice-url: ${PRIVACY_NOTICE_URL:}
  oauth:
    enabled: ${OAUTH_ENABLED:false}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    apple:
      client-id: ${APPLE_CLIENT_ID:}
      client-secret: ${APPLE_CLIENT_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
