server:
  port: ${PORT:8080}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

spring:
  application:
    name: cei-pass-api
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS app
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: app
    defer-datasource-initialization: true
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      platform: h2
  h2:
    console:
      enabled: true
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:6831503090@lamduan.mfu.ac.th}
    password: xhvsixymrpqccdcz
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080}
  auth:
    frontend-url: ${FRONTEND_URL:http://localhost:8080}
    registration-enabled: true
  privacy:
    notice-version: ${PRIVACY_NOTICE_VERSION:v1.0}
    notice-url: ${PRIVACY_NOTICE_URL:https://example.com/privacy}
  oauth:
    enabled: ${OAUTH_ENABLED:false}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    apple:
      client-id: ${APPLE_CLIENT_ID:}
      client-secret: ${APPLE_CLIENT_SECRET:}
  mail:
    mode: ${MAIL_MODE:smtp}
    from: ${MAIL_FROM:6831503090@lamduan.mfu.ac.th}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
