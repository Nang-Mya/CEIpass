<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f6f7f2">
    <meta name="description" content="Explore Chiang Rai with one convenient visitor pass.">
    <link rel="manifest" href="./manifest.webmanifest">
    <title>Chiang Rai Pass</title>
    <link rel="stylesheet" href="./css/styles.css">
    <script src="./js/config.js" defer></script>
    <script src="./js/app.js" defer></script>
  </head>
  <body>
    <div class="app-frame">
      <header class="topbar">
        <a class="brand" href="#home" aria-label="Chiang Rai Pass home">
          <span class="brand-mark" aria-hidden="true">C</span>
          <span>Chiang Rai <span class="brand-light">Pass</span></span>
        </a>
        <button class="icon-button" type="button" data-navigate="profile" aria-label="Open profile">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 20c.6-3.7 3-5.5 7-5.5s6.4 1.8 7 5.5"></path></svg>
        </button>
      </header>

      <main id="app-content" class="app-content" tabindex="-1"></main>

      <nav class="bottom-nav" aria-label="Main navigation">
        <a href="#home" data-page="home" aria-current="page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"></path></svg>
          <span>Home</span>
        </a>
        <a href="#buy" data-page="buy">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16l-1.5 15h-13z"></path><path d="M9 9V7a3 3 0 0 1 6 0v2"></path></svg>
          <span>Buy</span>
          <span id="cart-count" class="nav-count" hidden>0</span>
        </a>
        <a href="#qr" data-page="qr">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><path d="M14 14h3v3h-3zM20 14v2M14 20h2M19 19h2v2h-2z"></path></svg>
          <span>My QR</span>
        </a>
        <a href="#history" data-page="history">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h16"></path><circle cx="7" cy="5" r="1"></circle><circle cx="7" cy="12" r="1"></circle><circle cx="7" cy="19" r="1"></circle></svg>
          <span>History</span>
        </a>
        <a href="#profile" data-page="profile">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 20c.6-3.7 3-5.5 7-5.5s6.4 1.8 7 5.5"></path></svg>
          <span>Profile</span>
        </a>
      </nav>
      <div id="app-announcer" class="visually-hidden" role="status" aria-live="polite"></div>
    </div>
  </body>
</html>
